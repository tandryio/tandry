name: release npm clients
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Client version (e.g. 0.1.0 or 0.1.1-rc.1)"
        required: true
        type: string
      tag:
        description: "npm distribution tag"
        type: choice
        options: [next, latest]
        default: next
      dry_run:
        description: "Validate and upload archives without publishing"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: npm-client-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      NPM_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Check marketplace credentials before publishing
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.MARKETPLACE_TOKEN }}
        run: |
          test -n "$GH_TOKEN" || { echo "MARKETPLACE_TOKEN is required for the coordinated release"; exit 1; }
          gh api repos/tandryio/tandry-marketplace --jq '.permissions.push' | grep -qx true
      - name: Install dependencies and validate release inputs
        run: |
          pnpm install --frozen-lockfile
          node scripts/npm-release.mjs validate
          npm install --global npm@11.19.0
      - name: Build and test
        run: |
          pnpm website:build
          node --test website/scripts/i18n.test.mjs
          pnpm typecheck
          pnpm build
          pnpm check:source
          pnpm test:marketplace
          pnpm test:npm
          pnpm test:tooling
          pnpm test
          pnpm test:e2e
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
      - name: Pack validated npm artifacts
        run: |
          node scripts/npm-release.mjs pack
          node scripts/npm-release.mjs dry-run
      - uses: actions/upload-artifact@v4
        with:
          name: npm-clients-${{ inputs.version }}
          path: .local/npm/
          if-no-files-found: error
      - name: Publish npm artifacts with trusted publishing
        if: ${{ !inputs.dry_run }}
        run: node scripts/npm-release.mjs publish

  marketplace:
    name: Sync matching marketplace release
    needs: release
    if: ${{ !inputs.dry_run }}
    uses: ./.github/workflows/marketplace-release.yml
    with:
      version: ${{ inputs.version }}
    secrets:
      MARKETPLACE_TOKEN: ${{ secrets.MARKETPLACE_TOKEN }}
